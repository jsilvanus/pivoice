openapi: 3.1.0
info:
  title: PiVoice API
  version: 1.0.0
  description: 'Hama microphone capture (voice activity detection included) on the Pi, audio for web radio, transcription through liturgos-auditor, and caption delivery to the public relay and YouTube. The control API is for the Pi LAN only. Secrets are write-only: they are accepted by PUT /api/v1/config and returned as "***". Web radio and captions are delivered to web-radio-relay (jsilvanus/web-radio-relay).'
servers:
  - url: http://127.0.0.1:8095
    description: Default address of a local PiVoice (PIVOICE_HOST / PIVOICE_PORT)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: activity
  - name: capture
  - name: radio
  - name: transcription
  - name: captions
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Process liveness
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
  /ready:
    get:
      operationId: getReady
      tags:
        - system
      summary: Readiness (the HTTP server is accepting requests)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Probe"
  /api/v1/status:
    get:
      operationId: getStatus
      tags:
        - system
      summary: Capture, radio, transcription and caption state with lag and errors
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/audio/devices:
    get:
      operationId: listAudioDevices
      tags:
        - capture
      summary: ALSA capture devices (arecord -l), or the simulated source
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioDevices"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/config:
    get:
      operationId: getConfig
      tags:
        - system
      summary: Read the configuration (secrets shown as "***")
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateConfig
      tags:
        - system
      summary: Change configuration (partial; a secret sent back as "***" keeps its value)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigPatch"
      responses:
        "200":
          description: The configuration after the change, secrets redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "400":
          description: Invalid configuration (details list the paths, never the values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/capture/start:
    post:
      operationId: startCapture
      tags:
        - capture
      summary: Start the shared capture and the radio encoders (idempotent)
      responses:
        "200":
          description: Status after starting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/capture/stop:
    post:
      operationId: stopCapture
      tags:
        - capture
      summary: Stop capture, radio encoders and pending transcription
      responses:
        "200":
          description: Status after stopping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/activity/idle-close:
    get:
      operationId: getActivityIdleClose
      deprecated: true
      tags:
        - activity
      summary: Legacy PiVoice copy of idle-close setting; PiGateway owns the active timer
      responses:
        "200":
          description: Current timeout in seconds (0 disables automatic close)
          content:
            application/json:
              schema:
                type: object
                required: [idleCloseSeconds, prerollSeconds]
                properties:
                  idleCloseSeconds:
                    type: integer
                    minimum: 0
                    maximum: 3600
                  prerollSeconds:
                    type: integer
                    minimum: 0
                    maximum: 30
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: setActivityIdleClose
      deprecated: true
      tags:
        - activity
      summary: Update legacy idle-close setting; PiGateway owns the active timer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idleCloseSeconds]
              additionalProperties: false
              properties:
                idleCloseSeconds:
                  type: integer
                  minimum: 0
                  maximum: 3600
                  description: Seconds without speech/music activity before PiGateway closes the live session; 0 disables automatic close.
      responses:
        "200":
          description: Updated timeout
          content:
            application/json:
              schema:
                type: object
                required: [idleCloseSeconds, prerollSeconds]
                properties:
                  idleCloseSeconds:
                    type: integer
                    minimum: 0
                    maximum: 3600
                  prerollSeconds:
                    type: integer
                    minimum: 0
                    maximum: 30
        "400":
          description: Invalid request body
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/activity/session/start:
    post:
      operationId: startActivitySession
      tags: [activity]
      summary: Open an activity-triggered live Auditor session with the current rolling PCM pre-roll
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trigger:
                  type: string
                  enum: [speech, music]
                  default: speech
                delivery:
                  type: object
                  description: Optional transcript delivery config forwarded to Auditor
      responses:
        "200":
          description: Session started with pre-roll submitted before the live source is processed
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Capture or Auditor live mode is unavailable
  /api/v1/activity/session/stop:
    post:
      operationId: stopActivitySession
      tags: [activity]
      summary: Close the activity-triggered live Auditor session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  default: gateway
      responses:
        "200":
          description: Session stopped
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/transcription/events:
    get:
      operationId: streamTranscriptionEvents
      tags:
        - transcription
      summary: Server-sent events; "transcript", "capture" and "transcription" events
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Each event is "event: <type>" and "data: <JSON>". transcript data: seq, chunkSeq, startMs, endMs (epoch milliseconds), text, language.'
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/radio:
    get:
      operationId: getRadio
      tags:
        - radio
      summary: Radio targets with their encoder state and browser-facing HLS URL
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/captions/status:
    get:
      operationId: getCaptionsStatus
      tags:
        - captions
      summary: Caption destinations, without secrets
      responses:
        "200":
          description: Caption state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or wrong bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
    Probe:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
    Status:
      type: object
      required:
        - startedAt
        - uptimeSec
        - capture
        - voice
        - radio
        - transcription
        - captions
      properties:
        startedAt:
          type: string
          format: date-time
        uptimeSec:
          type: integer
        capture:
          type: object
          properties:
            mode:
              type: string
              enum:
                - alsa
                - simulated
            policy:
              type: string
              enum:
                - on
                - off
                - auto
              description: "on: capture continuously; off: no capture; auto: periodically probe for sound, capture while sound is present, then return to probing after quiet timeout."
            autoPollMode:
              type: string
              enum: [continuous, scheduled]
              description: "continuous probes again immediately after each short check; scheduled waits autoPollSeconds between checks."
            autoPollSeconds:
              type: integer
              minimum: 5
              maximum: 3600
            autoProbeSeconds:
              type: integer
              minimum: 1
              maximum: 5
            autoQuietSeconds:
              type: integer
              minimum: 5
              maximum: 600
            device:
              type: string
            running:
              type: boolean
            state:
              type: string
              enum:
                - stopped
                - running
                - restarting
            restarts:
              type: integer
            lastError:
              type:
                - string
                - "null"
        speechDetection:
          type: object
          description: In-process Silero VAD state; unavailable when ONNX Runtime or the model is missing.
          properties:
            available:
              type: boolean
            ready:
              type: boolean
            speaking:
              type: boolean
            probability:
              type: [number, 'null']
            at:
              type: [number, 'null']
            error:
              type: [string, 'null']
        spectral:
          type: object
          description: Current heuristic PCM spectral classification; not a trained model or calibrated confidence.
          properties:
            label:
              type: string
              enum: [unknown, silence, speech, music]
            confidence:
              type:
                - number
                - "null"
            at:
              type:
                - number
                - "null"
            features:
              type:
                - object
                - "null"
        auditorLive:
          type: object
          properties:
            configured:
              type: boolean
            running:
              type: boolean
            sessionId:
              type:
                - string
                - "null"
        radio:
          $ref: "#/components/schemas/RadioStatus/properties/targets"
        transcription:
          type: object
          description: "Transcription mode and state: queue depth, processed/dropped/stale chunks, lag in ms of the last chunk"
          properties:
            configured:
              type: boolean
            busy:
              type: boolean
            queued:
              type: integer
            maxQueue:
              type: integer
            processed:
              type: integer
            dropped:
              type: integer
            stale:
              type: integer
            failed:
              type: integer
            lagMs:
              type:
                - integer
                - "null"
            lastError:
              type:
                - string
                - "null"
            mode: &a1
              type: string
              enum:
                - on
                - off
                - auto
              description: "on: always. auto: only while speech is detected (VAD). off: never."
        captions:
          $ref: "#/components/schemas/CaptionsStatus"
        voice:
          type: object
          properties:
            open:
              type: boolean
            lastVoiceMs:
              type:
                - integer
                - "null"
    AudioDevices:
      type: object
      required:
        - devices
        - error
      properties:
        devices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: ALSA device for capture.device, e.g. hw:1,0
              card:
                type: integer
              device:
                type: integer
              cardName:
                type: string
              deviceName:
                type: string
        error:
          type:
            - string
            - "null"
    Config:
      type: object
      description: The configuration as stored (secrets are "***" or null)
      required:
        - capture
        - voice
        - radio
        - auditor
        - activity
        - captions
      properties:
        capture:
          type: object
          properties:
            mode:
              type: string
              enum:
                - alsa
                - simulated
            policy:
              type: string
              enum: [on, off, auto]
            autoPollSeconds:
              type: integer
              minimum: 5
              maximum: 3600
            autoProbeSeconds:
              type: integer
              minimum: 1
              maximum: 5
            autoQuietSeconds:
              type: integer
              minimum: 5
              maximum: 600
            device:
              type: string
            channels:
              type: integer
              enum:
                - 1
                - 2
            sampleRate:
              type: integer
              enum:
                - 44100
                - 48000
            chunkSeconds:
              type: number
              minimum: 1
              maximum: 30
            autostart:
              type: boolean
        activity:
          type: object
          properties:
            idleCloseSeconds:
              type: integer
              minimum: 0
              maximum: 3600
              description: Shared inactivity timeout for activity-triggered STT/MR sessions; 0 disables automatic close.
        radio:
          type: object
          properties:
            bitrate:
              type: string
              example: 96k
            targets:
              type: array
              maxItems: 8
              items:
                $ref: "#/components/schemas/RadioTarget"
        auditor:
          type: object
          properties:
            url:
              type:
                - string
                - "null"
              description: liturgos-auditor base URL (POST /inference)
            apiKey:
              type:
                - string
                - "null"
              description: Secret
            liveSourceUrl:
              type:
                - string
                - "null"
              format: uri
              description: "Optional rtsp/rtsps/srt source that liturgos-auditor pulls itself from MediaMTX. When set, PiVoice starts a live session instead of uploading chunks."
            startWhen:
              type: string
              enum: [capture_start, speech, speech_or_music]
              default: speech_or_music
              description: "PiGateway owns activity-triggered session starts and idle-close; capture_start is a legacy always-open mode. speech starts on speech only; speech_or_music starts on either classification."
            language:
              type: string
              example: fi
            timeoutMs:
              type: integer
            maxQueue:
              type: integer
            mode: *a1
        captions:
          type: object
          properties:
            relay:
              type: object
              description: web-radio-relay caption publishing (POST /api/v1/captions)
              properties:
                mode: *a1
                url:
                  type:
                    - string
                    - "null"
                token:
                  type:
                    - string
                    - "null"
                  description: "Secret: the relay RELAY_API_TOKEN"
            youtube:
              type: object
              description: YouTube caption delivery. auto = send while the stream is online, checked by polling the YouTube Data API with apiKey and videoId.
              properties:
                mode: *a1
                streamKey:
                  type:
                    - string
                    - "null"
                  description: Secret
                delayMs:
                  type: integer
                apiKey:
                  type:
                    - string
                    - "null"
                  description: "Secret: YouTube Data API key (used only for the stream-online check)"
                videoId:
                  type:
                    - string
                    - "null"
                  description: Video or live broadcast ID to watch for auto mode (11 characters)
        voice:
          type: object
          properties:
            thresholdDb:
              type: number
              minimum: -90
              maximum: -10
              description: Speech threshold in dBFS (RMS)
            hangoverSeconds:
              type: number
              minimum: 0.5
              maximum: 30
            prerollSeconds:
              type: number
              minimum: 0
              maximum: 5
              description: Audio kept before speech, sent when auto targets start
    ConfigPatch:
      type: object
      description: Any part of the Config object; nested objects are merged, arrays replaced
      additionalProperties: false
      properties:
        capture:
          type: object
        radio:
          type: object
        activity:
          type: object
          properties:
            idleCloseSeconds:
              type: integer
              minimum: 0
              maximum: 3600
        auditor:
          type: object
        captions:
          type: object
    RadioTarget:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
        name:
          type: string
        rtmpUrl:
          type:
            - string
            - "null"
          description: RTMP(S) ingest (web-radio-relay or local Tuberadio); the stream key is redacted
        hlsUrl:
          type:
            - string
            - "null"
          description: Public HLS URL for listeners
        mode: *a1
    RadioStatus:
      type: object
      required:
        - targets
      properties:
        targets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              hlsUrl:
                type:
                  - string
                  - "null"
              state:
                type: string
                enum:
                  - off
                  - unconfigured
                  - waiting
                  - running
                  - stopped
                  - restarting
              restarts:
                type: integer
              lastError:
                type:
                  - string
                  - "null"
              dropped:
                type: integer
              mode: *a1
    CaptionsStatus:
      type: object
      required:
        - relay
        - youtube
      properties:
        relay:
          type: object
          properties:
            configured:
              type: boolean
            running:
              type: boolean
            streamId:
              type:
                - string
                - "null"
            queued:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            dropped:
              type: integer
            lastError:
              type:
                - string
                - "null"
            lastSentAt:
              type:
                - string
                - "null"
              format: date-time
            mode: *a1
        youtube:
          type: object
          properties:
            configured:
              type: boolean
            running:
              type: boolean
            delayMs:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            lastError:
              type:
                - string
                - "null"
            mode: *a1
            effective:
              type: string
              enum:
                - on
                - off
              description: Whether captions are being sent to YouTube now
            stream:
              type: object
              description: Stream-online check used by auto mode
              properties:
                configured:
                  type: boolean
                watching:
                  type: boolean
                online:
                  type: boolean
                lastCheckedAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                lastError:
                  type:
                    - string
                    - "null"
