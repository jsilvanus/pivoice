name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CLI table matches openapi/openapi.yaml
        run: pnpm run check:generated
      - name: Tests
        run: pnpm test

  # The fffleet translation worker image (docker/translate-worker.Dockerfile, plan §7). Built and smoke-tested
  # on every push and PR; pushed to ghcr.io/<owner>/pivoice-translate-worker on main. The smoke test fetches
  # the fi-en model (Xenova/opus-mt-fi-en, about 110 MB) into a throwaway volume; no weights in the image.
  translate-worker-image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/translate-worker.Dockerfile
          load: true
          tags: pivoice-translate-worker:ci
      - name: Smoke test (fetch fi-en, start-up scan, translate through the executor)
        run: |
          docker volume create tm
          docker run --rm --user root --entrypoint node -v tm:/models pivoice-translate-worker:ci \
            /app/fleet/translate/scripts/fetch-models.mjs --dir /models --directions fi-en
          docker run --rm -e FFFLEET_WORKER_BIN=env -v tm:/models:ro pivoice-translate-worker:ci 2>&1 \
            | tee /tmp/scan.log | grep -E 'directions ready|FFFLEET_CAPABILITIES'
          grep -q 'FFFLEET_CAPABILITIES=.*translate:fi-en' /tmp/scan.log
          docker run --rm -v tm:/models:ro -w /app/fleet/translate -e PIVOICE_TRANSLATE_MODEL_DIR=/models \
            pivoice-translate-worker:ci node --test test/marian-onnx.test.js
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/translate-worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pivoice-translate-worker:latest
            ghcr.io/${{ github.repository_owner }}/pivoice-translate-worker:${{ github.sha }}
